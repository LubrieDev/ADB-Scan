[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
