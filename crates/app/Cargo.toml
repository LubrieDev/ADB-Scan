[package]
name = "adb-scan"
description = "Monitoring, diagnostics and tools for Android phones"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository = "https://github.com/LubrieDev/ADB-Scan"

[[bin]]
name = "adb-scan"
path = "src/main.rs"

[dependencies]
adbscan-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
libc = "0.2"
vte = { package = "vte4", version = "0.9", features = ["v0_76"] }
async-channel = "2"
pangocairo = "0.21"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
log.workspace = true
regex.workspace = true
serde_json.workspace = true

# Debian package: `cargo deb -p adb-scan` (see RELEASING.md). Paths are
# relative to this crate; `target/release/` is the workspace's build output.
[package.metadata.deb]
maintainer = "ADB Scan <adb-scan@localhost>"
copyright = "2026, LubrieDev"
section = "utils"
priority = "optional"
# `$auto` reads the shared libraries the binary links (GTK 4, libadwaita,
# VTE…) with dpkg-shlibdeps; adb is called as a program, so it is listed.
depends = "$auto, adb"
recommends = "fastboot, scrcpy, curl, avahi-utils, libglib2.0-bin"
suggests = "tshark"
extended-description = """\
ADB Scan is a native app (Rust, GTK 4 and libadwaita) that detects and \
monitors Android devices. Without debugging it offers a basic analysis over \
USB and MTP; with USB or wireless debugging (QR code or manual pairing): \
live telemetry, battery, performance, apps, files, logcat, a terminal, \
screen mirroring with scrcpy, flashing with safeguards, wireless ADB and a \
security audit without root. Interface in English and Spanish.

Everything is processed and stored locally, with no telemetry. It only \
connects to the Internet when asked (the public IP, queried by the phone, and \
the tools assistant's downloads) and, unless turned off, once at startup to \
check GitHub for a newer release."""
maintainer-scripts = "../../packaging/debian/"
assets = [
    ["target/release/adb-scan", "usr/bin/", "755"],
    ["../../packaging/adb-scan.desktop", "usr/share/applications/", "644"],
    ["../../packaging/com.adbscan.AdbScan.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../assets/icons/hicolor/scalable/apps/*.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/51-adb-scan.rules", "lib/udev/rules.d/", "644"],
    ["../../README.md", "usr/share/doc/adb-scan/", "644"],
    ["../../docs/USAGE.md", "usr/share/doc/adb-scan/", "644"],
    ["../../docs/LIMITATIONS.md", "usr/share/doc/adb-scan/", "644"],
    ["../../assets/icons/LICENSE-lucide", "usr/share/doc/adb-scan/", "644"],
]
