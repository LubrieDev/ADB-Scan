[package]
name = "adbscan-core"
description = "ADB Scan core: ADB, fastboot, parsers, telemetry and storage (no interface)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
log.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
# QR code for wireless pairing (encoder only, no images).
qrcode = { version = "0.14", default-features = false }
semver = "1.0.28"
ureq = "3.2.1"

# POSIX calls: process groups and signals, usbfs, netlink, localtime_r.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: known folders (%APPDATA%, Pictures…), job objects, process
# termination, the time zone and the system's random generator.
[target.'cfg(windows)'.dependencies]
dirs = "6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
] }
