<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- ADB Scan: teléfono atravesado por una línea de escaneo que se vuelve pulso. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#34343b"/>
      <stop offset="1" stop-color="#17171b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff7a1a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="18" y1="64" x2="110" y2="64">
      <stop offset="0" stop-color="#ffb066"/>
      <stop offset="1" stop-color="#e66100"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="43" y="21" width="42" height="86" rx="9"/>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
  <!-- haz de escaneo dentro de la pantalla -->
  <rect x="43" y="44" width="42" height="40" fill="url(#beam)" clip-path="url(#screen)"/>
  <!-- teléfono -->
  <rect x="40" y="18" width="48" height="92" rx="12" fill="none" stroke="#f2f0ed" stroke-width="5"/>
  <rect x="57" y="25" width="14" height="4" rx="2" fill="#f2f0ed" opacity="0.85"/>
  <!-- línea de escaneo que se convierte en pulso -->
  <polyline points="20,64 47,64 54,64 59,49 66,80 72,57 76,64 108,64"
            fill="none" stroke="url(#pulse)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="64" r="4.5" fill="#ffb066"/>
  <circle cx="108" cy="64" r="4.5" fill="#e66100"/>
</svg>
